name: Actualizar ayudas
on:
  schedule:
    - cron: "0 5 * * *"   # cada día, 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
      - name: Traducir al euskera (solo textos nuevos)
        run: python scripts/translate_eu.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Generar páginas, sitemap y feed
        run: python scripts/build_site.py
      - name: Commit si hay cambios
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          git diff --staged --quiet || (git commit -m "Actualizar datos" && git push)
