  $('stats').innerHTML='<span><b>'+open.length+'</b> '+t('open')+'</span><span><b>'+open.filter(x=>{const n=days(x.end);return n!==null&&n<=14}).length+'</b> '+t('c14')+'</span><span><b>'+open.filter(x=>x.dificultad==='facil').length+'</b> '+t('easy')+'</span>';
  if(!loaded){$('list').innerHTML='<div class="empty">'+t('loading')+'</div>';return}
  const r=open.filter(pass),rank=x=>DF[x.dificultad]?DF[x.dificultad][0]:2,e=x=>days(x.end)??1e9;
  r.sort((a,b)=>$('ord').value==='dif'?rank(a)-rank(b)||e(a)-e(b):e(a)-e(b));
  $('count').textContent=r.length+' '+(r.length===1?t('one'):t('many'));
  $('reset').hidden=!(m!=='all'||d!=='todas'||term||$('pf').value!=='Todas');
  const eu=lang==='eu';
  $('list').innerHTML=r.length?r.map(x=>{
    const n=days(x.end),[ic,h]=AR[x.area]||AR.Otras,[dn,dc]=DF[x.dificultad]||DF.media,dl=t('d_'+(x.dificultad||'media'));
    const bd=n===null?[t('nolimit'),'']:n===0?[t('today'),'hot']:n<=7?[t('left')(n),'hot']:n<=30?[t('left')(n),'warm']:n>400?[t('openb'),'']:[t('left')(n),''];
    const dots=[1,2,3].map(i=>'<i class="dot'+(i<=dn?' on':'')+'"></i>').join('');
    const rs=eu?(x.resumen_eu||x.resumen):x.resumen,imp=eu?(x.importe_eu||x.importe):x.importe,ck=eu?(x.claves_eu||x.claves):x.claves;
    return '<article class="card" style="--h:'+h+'"><div class="top"><div class="ico">'+ic+'</div><span class="badge '+bd[1]+'">'+bd[0]+'</span></div><h2>'+esc(eu&&x.title_eu||x.title)+'</h2><div class="org">'+esc(eu&&x.org_eu||x.org)+'</div>'+(eu&&x.eu_auto&&!x.claves?'<div class="src">'+t('auto')+'</div>':'')
    +(rs?'<p class="rs">'+esc(rs)+'</p>':'')
    +'<div class="meta"><span class="diff" style="--c:'+dc+'" title="'+t('diffT')+'">'+dots+'<span>'+dl+'</span></span><span class="pill">'+t('pf_'+(x.perfil||'Todos'))+'</span>'+(imp?'<span class="imp">'+esc(imp)+'</span>':'')+'</div>'
    +(ck&&ck.length?'<details><summary>'+t('keys')+'</summary><ul>'+ck.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>'+(x.fuente?'<div class="src">'+t('src')+': '+esc(eu&&x.fuente_eu||x.fuente)+'</div>':'')+'</details>':'')
    +'<div class="foot"><span class="date">'+(x.end?t('until')+(eu?': ':' ')+fmt(x.end):t('nocl'))+'</span>'+(x.slug?'<a class="more" href="'+(eu?'eu/':'')+'ayuda/'+esc(x.slug)+'.html">'+t('more')+'</a>':'')+'<a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+t('see')+'</a></div></article>'}).join(''):'<div class="empty">'+t('none')+'</div>';
}
function nextClosings(){const n=items.filter(x=>x.end&&isOpen(x)&&days(x.end)<=60).sort((a,b)=>days(a.end)-days(b.end)).slice(0,4);
  $('nx').innerHTML='<h3>'+t('nx')+'</h3>'+(n.length?n.map(x=>{const k=days(x.end);return '<a href="'+esc(x.url)+'" target="_blank" rel="noopener"><em>'+(k===0?t('nxtoday'):t('nxin')(k))+' · '+fmt(x.end)+'</em>'+esc(lang==='eu'&&x.title_eu||x.title)+'</a>'}).join(''):'<div class="nt">'+t('nxnone')+'</div>')}
/* Tiempo */
const CITY=['Bilbao','Donostia','Vitoria-Gasteiz'];
const DEMO=[[14,3,[[3,18,11,40],[61,16,10,70],[2,19,11,20]]],[15,61,[[61,17,12,60],[3,18,12,40],[1,20,12,10]]],[11,3,[[3,15,7,30],[61,14,8,60],[2,17,7,20]]]].map(([a,c,dd])=>({t:a,c,dd}));
const WI=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':'⛈️';
let wd=null,wi=0,wdemo=false;
function wx(){const c=wd[wi];
  $('wx').innerHTML='<h3>'+t('wx')+'</h3><div class="wt">'+CITY.map((n,i)=>'<button data-i="'+i+'" aria-pressed="'+(i===wi)+'">'+n+'</button>').join('')+'</div>'
  +'<div class="now"><span>'+WI(c.c)+'</span><b>'+Math.round(c.t)+'°</b></div>'
  +c.dd.map((x,i)=>{const dn=i===0?t('wxtoday'):new Date(Date.now()+i*864e5).toLocaleDateString(lang,{weekday:'short'});return '<div class="dy"><span>'+dn+' '+WI(x[0])+'</span><span>'+Math.round(x[1])+'° / '+Math.round(x[2])+'° <em>· 💧'+(x[3]??0)+'%</em></span></div>'}).join('')
  +'<div class="nt">'+(wdemo?t('wxdemo'):t('wxsrc'))+'</div>';
  $('wx').querySelectorAll('.wt button').forEach(b=>b.onclick=()=>{wi=+b.dataset.i;wx()})}
fetch('https://api.open-meteo.com/v1/forecast?latitude=43.263,43.318,42.847&longitude=-2.935,-1.981,-2.673&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMadrid&forecast_days=3')
.then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{wd=j.map(c=>({t:c.current.temperature_2m,c:c.current.weather_code,dd:c.daily.time.map((_,i)=>[c.daily.weather_code[i],c.daily.temperature_2m_max[i],c.daily.temperature_2m_min[i],c.daily.precipitation_probability_max[i]])}));wx()})
.catch(()=>{wd=DEMO;wdemo=true;wx()});
/* Cabecera rotativa: fotos de hero.json si existen; si no, ilustraciones */
const WV='<defs><pattern id="wv" width="50" height="12" patternUnits="userSpaceOnUse"><path d="M0 6q12.5-8 25 0t25 0" fill="none" style="stroke:var(--sea)" stroke-width="3"/></pattern></defs>';
const SV=(a,b)=>'<svg viewBox="0 0 1000 210" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+a+b+'</svg>';
const SUN=x=>'<circle cx="'+x+'" cy="70" r="28" fill="#f4b942" opacity=".9"/>';
const SC=[
{es:'La Concha, Donostia',eu:'Kontxa, Donostia',html:SV(WV+SUN(780),'<rect y="150" width="1000" height="60" style="fill:var(--sea)"/><path d="M0 210V120Q90 70 230 125L330 210Z" style="fill:var(--h2)"/><path d="M830 210V135Q890 85 1000 120V210Z" style="fill:var(--h2)"/><path d="M520 152Q555 122 595 152Z" style="fill:var(--h3)"/><path d="M250 210Q560 140 900 210Z" style="fill:var(--sand)"/><rect y="168" width="1000" height="14" fill="url(#wv)"/>')},
{es:'San Juan de Gaztelugatxe, Bizkaia',eu:'Gaztelugatxeko Doniene, Bizkaia',html:SV(SUN(210),'<rect y="140" width="1000" height="70" style="fill:var(--sea)"/><rect y="172" width="1000" height="14" fill="url(#wv)"/><path d="M0 210V105Q120 90 240 130L330 210Z" style="fill:var(--h2)"/><path d="M590 165Q620 80 690 100Q740 105 770 165Z" style="fill:var(--h3)"/><rect x="676" y="82" width="22" height="16" style="fill:var(--card)"/><path d="M672 82L687 70L702 82Z" style="fill:var(--red)"/><path d="M300 160Q420 138 470 158T590 152" fill="none" style="stroke:var(--muted)" stroke-width="6" stroke-linecap="round"/><path d="M600 150L640 138L620 124L660 112L645 100" fill="none" style="stroke:var(--card)" stroke-width="3" stroke-linejoin="round"/>')},
{es:'Bilbao y su ría',eu:'Bilbo eta bere itsasadarra',html:SV(SUN(170),'<path d="M0 210V110Q200 60 420 100T800 90Q920 80 1000 110V210Z" style="fill:var(--h1)"/><path d="M0 210V150Q250 110 500 150T1000 140V210Z" style="fill:var(--h2)"/><path d="M0 185Q300 170 560 182T1000 176V210H0Z" style="fill:var(--sea)"/><g style="fill:var(--muted)" opacity=".85"><path d="M560 184Q580 120 640 110Q700 105 740 150Q760 172 760 184Z"/><path d="M620 184Q650 140 700 135Q730 140 735 184Z" opacity=".6"/></g><path d="M300 184Q400 122 500 184" fill="none" style="stroke:var(--card)" stroke-width="4"/>')}
];
let SL=SC,hi=0,timer=null;
function go(i){hi=i;[...$('sls').children].forEach((e,k)=>e.classList.toggle('on',k===i));[...$('dots').children].forEach((e,k)=>e.classList.toggle('on',k===i));cap()}
function cap(){const s=SL[hi];if(s)$('cap').textContent=(lang==='eu'?s.eu:s.es)+(s.credit?' · '+s.credit:'')}
function restart(){clearInterval(timer);if(SL.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>go((hi+1)%SL.length),6000)}
function heroBuild(){$('sls').innerHTML=SL.map((s,i)=>'<div class="sl'+(i?'':' on')+'">'+s.html+'</div>').join('');
  $('dots').innerHTML=SL.map((s,i)=>'<button aria-label="'+(i+1)+'"></button>').join('');
  [...$('dots').children].forEach((b,i)=>b.onclick=()=>{go(i);restart()});go(0);restart()}
$('hero').onmouseenter=()=>clearInterval(timer);$('hero').onmouseleave=restart;
heroBuild();
fetch('hero.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(!Array.isArray(j)||!j.length)throw 0;
  SL=j.map(p=>({es:p.es,eu:p.eu||p.es,credit:p.credit,html:'<img src="'+esc(p.src)+'" alt="'+esc(p.es)+'" loading="lazy">'}));
  $('hero').classList.add('photo');hi=0;heroBuild()}).catch(()=>{});
/* Tema, idioma */
function applyTheme(){const r=document.documentElement;r.removeAttribute('data-theme');if(th!=='auto')r.setAttribute('data-theme',th);$('thm').textContent={auto:'🌓',light:'☀️',dark:'🌙'}[th]}
$('thm').onclick=()=>{th={auto:'light',light:'dark',dark:'auto'}[th];LS.set('theme',th);applyTheme()};
function fillSel(){const pf=$('pf').value||'Todas',od=$('ord').value||'fin';
  $('pf').innerHTML=[['Todas','pf_all'],['Particulares','pf_Particulares'],['Empresas','pf_Empresas'],['Entidades','pf_Entidades']].map(([v,k])=>'<option value="'+v+'">'+t(k)+'</option>').join('');$('pf').value=pf;
  $('ord').innerHTML=[['fin','o_fin'],['dif','o_dif']].map(([v,k])=>'<option value="'+v+'">'+t(k)+'</option>').join('');$('ord').value=od}
function statics(){document.documentElement.lang=lang;document.title='Laguntzak · '+t('title');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('l_about').href=(lang==='eu'?'eu/':'')+'sobre.html';$('q').placeholder=t('ph');$('thm').title=t('theme');
  $('foot').textContent=t('foot')+(UPD?' '+t('upd')+': '+fmt(UPD)+'.':'');
  $('lg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  fillSel();draw();nextClosings();if(wd)wx();cap()}
$('lg').querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;LS.set('lang',lang);statics()});
$('q').oninput=e=>{term=e.target.value.toLowerCase();draw()};
$('cl').onclick=()=>{$('q').value='';term='';draw()};
$('pf').onchange=$('ord').onchange=draw;
$('reset').onclick=()=>{m='all';d='todas';term='';$('q').value='';$('pf').value='Todas';draw()};
applyTheme();statics();
function init(x){items=x.items;loaded=true;UPD=(x.updated||'').slice(0,10);statics()}
(window.__DATA__?Promise.resolve(window.__DATA__):fetch('data.json').then(r=>{if(!r.ok)throw 0;return r.json()})).then(init)
.catch(()=>{loaded=true;$('list').innerHTML='<div class="empty">Falta data.json. Ejecuta scripts/update_data.py.</div>'});
</script>
</body>
